name: Live Tempo checks

# Checks on Moderato that what the SDK builds still works on Tempo. The envelope check asks Tempo's
# own signature verifier and only reads. The agent key check authorizes a key with keys made for
# the run, paid for by the testnet faucet. Neither needs a secret or touches real money. It runs
# daily, so a Tempo upgrade that changes a rule shows up before a business's signature fails.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keychain:
    name: Keychain envelope and agent keys against Moderato
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the envelope on Moderato
        run: pnpm --filter @avow-finance/spec exec vitest run src/keychain.live.test.ts
        env:
          AVOW_LIVE_TEMPO: "1"

      - name: Authorize an agent key from a mandate on Moderato
        run: pnpm --filter @avow-finance/sdk exec vitest run src/agent-key.live.test.ts
        env:
          AVOW_LIVE_TEMPO: "1"
