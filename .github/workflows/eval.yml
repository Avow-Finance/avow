name: Eval

# Runs the agent session's eval in the fixture world, five times for each local model Ollama pulls
# here, and writes a table of each step to the job summary with the report as an artifact. The
# fixture world needs no testnet and no secret. A Claude run joins as the reference only when the
# repository has an ANTHROPIC_API_KEY secret, and it's billed to that key.

on:
  workflow_dispatch:
    inputs:
      models:
        description: Local models to evaluate, comma separated
        default: qwen3:4b,llama3.1:8b,qwen3:8b
      trials:
        description: Runs per model
        default: '5'

permissions:
  contents: read

jobs:
  eval:
    name: Eval each model in the fixture world
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          until curl -fs http://127.0.0.1:11434/api/tags > /dev/null; do sleep 1; done

      - name: Eval each model
        env:
          MODELS: ${{ inputs.models }}
          TRIALS: ${{ inputs.trials }}
        run: |
          mkdir -p eval
          status=0
          for model in ${MODELS//,/ }; do
            ollama pull "$model"
            pnpm eval -- --provider local --model "$model" --trials "$TRIALS" --out "eval/${model//[:\/]/-}.json" || status=1
          done
          exit $status

      - name: Eval Claude as the reference
        if: ${{ !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIALS: ${{ inputs.trials }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret, so no Claude reference run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm eval -- --provider anthropic --trials "$TRIALS" --out eval/claude.json

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval
          path: eval/
