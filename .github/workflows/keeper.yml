name: Keeper

# Sends each step that has come due on the demo factory's locks on Moderato, for sides reserved
# within LOOKBACK_DAYS, such as returning a reserve nobody accepted, releasing a kept one at its
# release date or paying a confirmed charge once its contest window closes, so those steps land
# when Avow's settlement service is down. Each run makes its own key, has Moderato's faucet fund it
# when a step is due and signs locally, so the workflow holds no secret. Nothing here moves real
# money.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run that outlasts the schedule holds the next one back until it ends.
concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    name: Send the steps due on Moderato
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The demo factory, and the block it was created in, where the search for its locks starts.
      AVOW_FACTORY: "0x8fa7177c84BE069df2a51F096ED28d5D661B8283"
      AVOW_FACTORY_START_BLOCK: "41801818"
      # The keeper sends steps only for sides reserved within these days. Each run's summary names
      # the oldest reserve it reached.
      LOOKBACK_DAYS: "14"
      # A run starts no query or send after these minutes, so it ends inside timeout-minutes, and
      # it reports what it didn't reach.
      RUN_MINUTES: "8"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "@avow-examples/keeper..." build

      - name: Send the steps that are due
        run: pnpm --filter @avow-examples/keeper start
